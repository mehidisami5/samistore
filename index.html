<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sami Store</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; direction: rtl; }
        header { text-align: center; padding: 10px; background: #333; color: #fff; border-radius: 8px; }
        .admin-section { background: #fff; padding: 15px; margin: 20px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 5px; width: calc(100% - 22px); border: 1px solid #ccc; border-radius: 5px; }
        button { background: #28a745; color: white; font-weight: bold; cursor: pointer; border: none; }
        button.delete-btn { background: #dc3545; width: auto; padding: 5px 10px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card img { max-width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

    <header>
        <h1>Sami Store 🛒</h1>
    </header>

    <div class="admin-section">
        <h3>إضافة منتج جديد</h3>
        <input type="text" id="pName" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="السعر (د.ج)">
        <input type="text" id="pImg" placeholder="رابط صورة المنتج">
        <button onclick="addProduct()">إضافة المنتج</button>
    </div>

    <h2>المنتجات المتاحة</h2>
    <div class="products-grid" id="productsContainer">
        <p>جاري تحميل المنتجات...</p>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات مشروعك الخاط بـ Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDnkOEPVG-soKk6l-dnGZQYKe1cDC2TbuM",
            authDomain: "samistore-398f8.firebaseapp.com",
            projectId: "samistore-398f8",
            storageBucket: "samistore-398f8.firebasestorage.app",
            messagingSenderId: "874051464169",
            appId: "1:874051464169:web:56624ad666aec5aff3978",
            measurementId: "G-06RDDBXB4L"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // جلب المنتجات من قاعدة البيانات
        async function loadProducts() {
            const querySnapshot = await getDocs(collection(db, "products"));
            const container = document.getElementById("productsContainer");
            container.innerHTML = "";

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${data.image || 'https://via.placeholder.com/150'}" alt="${data.name}">
                        <h4>${data.name}</h4>
                        <p>${data.price} د.ج</p>
                        <button class="delete-btn" onclick="deleteProduct('${docSnap.id}')">حذف</button>
                    </div>
                `;
            });
        }

        // إضافة منتج جديد
        window.addProduct = async function() {
            const name = document.getElementById("pName").value;
            const price = document.getElementById("pPrice").value;
            const image = document.getElementById("pImg").value;

            if(!name || !price) {
                alert("يرجى ملء الاسم والسعر على الأقل!");
                return;
            }

            await addDoc(collection(db, "products"), {
                name: name,
                price: price,
                image: image
            });

            document.getElementById("pName").value = "";
            document.getElementById("pPrice").value = "";
            document.getElementById("pImg").value = "";

            loadProducts();
        };

        // حذف منتج
        window.deleteProduct = async function(id) {
            await deleteDoc(doc(db, "products", id));
            loadProducts();
        };

        // تحميل المنتجات فور فتح الصفحة
        loadProducts();
    </script>
</body>
</html>
